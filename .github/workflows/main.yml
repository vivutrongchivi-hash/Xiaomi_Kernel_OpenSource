name: Build Kernel DTB (Fast & Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    # 📦 Cài dependencies
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex make libssl-dev \
        libncurses5-dev gcc-aarch64-linux-gnu \
        gcc-arm-linux-gnueabi python2

    # 🔥 Fix Python cho MediaTek (DrvGen bắt buộc Python2)
    - name: Set Python2 as default
      run: |
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        python --version

    - name: Create Output Folder
      run: mkdir -p out

    # ⚙️ Load config
    - name: Load Defconfig
      run: |
        make O=out ARCH=arm64 dandelion_defconfig

    # 🔥 Fix lỗi stack protector
    - name: Fix Stack Protector
      run: |
        scripts/config --file out/.config -d CC_STACKPROTECTOR_STRONG
        scripts/config --file out/.config -e CC_STACKPROTECTOR_NONE
        make O=out ARCH=arm64 olddefconfig

    # 🚀 Build kernel + dtb (cái bạn cần)
    - name: Build Image.gz-dtb
      run: |
        make -j$(nproc) O=out \
        ARCH=arm64 \
        CROSS_COMPILE=aarch64-linux-gnu- \
        CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
        Image.gz-dtb

    # 📤 Upload kết quả
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel_dtb
        path: out/arch/arm64/boot/Image.gz-dtb